name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    permissions:
      security-events: write # upload code scanning results
      packages: read # fetch internal/private CodeQL packs
      actions: read # required for the "actions" language on private repos
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-24.04
          - language: python
            build-mode: none
            runner: ubuntu-24.04
          - language: swift
            build-mode: manual
            runner: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        if: matrix.language == 'swift'
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Swift uses build-mode: manual instead of autobuild so CodeQL traces the
      # real swiftc invocations from xcodebuild and builds a complete database.
      # Autobuild can pick the wrong target or produce an empty database for an
      # XcodeGen-generated app, so we build the committed XPWaste.xcodeproj the
      # same way the app is normally built.
      #
      # ARCHS=arm64 builds a single architecture (the macos runner's native
      # simulator slice) instead of arm64 + x86_64. CodeQL traces swiftc and
      # extracts each compiled source file, so building both simulator arches
      # extracts every file twice into an identical database. One arch produces
      # the same analysis while roughly halving this (dominant) traced build.
      #
      # Note: don't cache DerivedData across runs to skip this build. CodeQL only
      # extracts files the traced build actually recompiles, so a warm/incremental
      # build would yield an empty or incomplete database.
      - name: Build Swift (manual)
        if: matrix.language == 'swift'
        run: |
          xcodebuild clean build \
            -project XPWaste.xcodeproj \
            -scheme XPWaste \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3.37.7
        with:
          category: "/language:${{ matrix.language }}"
