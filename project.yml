name: XPWaste
options:
  bundleIdPrefix: com.callmegreg
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "10"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  XPWaste:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        DEVELOPMENT_TEAM: ACPF4NWF99
        PRODUCT_BUNDLE_IDENTIFIER: com.callmegreg.xpwaste
        GENERATE_INFOPLIST_FILE: "YES"
        # Partial Info.plist merged with the generated keys. Needed because Xcode's
        # Info.plist generation ignores the ~ipad device suffix on INFOPLIST_KEY_*
        # settings, so iPad-specific orientations must be supplied via a real plist.
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "XP Waste"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  XPWaste:
    build:
      targets:
        XPWaste: all
    run:
      config: Debug
      storeKitConfiguration: Config/Products.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
